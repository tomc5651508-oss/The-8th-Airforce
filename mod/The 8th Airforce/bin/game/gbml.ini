; GB Mod Loader 1.5.0 settings for The 8th Airforce (next to winmm.dll + GBML.dll in bin\game).
; Lines starting with ; are notes and are ignored.

[loader]
enabled=1
log=1
; 0 = load only the plugins listed under [plugins]
auto_load=0
update_ini=0

[multiplayer]
handshake=1
strict=1
kick=1
host_mods_on=1
secret=
local=
hostonly=

[server]
enabled=0
allow_unguarded=0

[server_plugins]

[plugins]
; planeint = modified plane scripts (the B-17E on the Pe-2 ser.35 slot), mode=uniform, single player
planeint=1
; jhfm = B-17E weight, inertia, wing and engine figures on the Pe-2 ser.35 host (no other plane changed)
jhfm=1
