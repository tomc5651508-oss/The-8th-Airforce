; The 8th Airforce: this jhfm.ini switches on ONLY the B-17E (Pe-2 ser.35 slot) sections; every other host = stock,
; tank_fire_s = stock 10.
; jhfm.ini - GB Mod Loader plugin "jhfm" (Jungle Hawks FM) 1.4.4 (settings 1.4.4), build 20261004. WRITTEN by tools/jhfm_write_ini3.py
;   from tools/jhfm_bench3.py (fit3.json, FIT3.md). Fork of Dusty's fmfix. Single player only. Load AFTER fmfix if both.
;
; 1.4.0 = REAL WEIGHTS. [PLANE@<host class>] enabled=1 switches that host on (0 = exactly stock). Every change reaches
;   the player AND AI planes of that host class, and only them.
;   mass_scale    k: the host's airframe part masses x k while the plane is built (fuel, crew, ammo, stores keep
;                 their real weight), so at the host's standard load the plane weighs the historical loaded weight.
;   inertia_scale j: the parts' moments of inertia x j (default = mass_scale).
;   aero_scale    s: every aerodynamic force and moment x s = real wing area / host wing area (an input).
;   drag_scale    d: the drag component of every aerodynamic force x d (real drag area = s d x host drag area).
;   thrust_scale  t: the propeller force x t at sea level (near real power / host power).
;   thrust_scale_hi / thrust_alt: the factor at thrust_alt m and above (linear between): thrust by height, for hosts
;                 whose engines lose power with height differently from the real plane's. Airscrew height +0xd8.
;   thrust_table (1.4.2, replaces the three keys above): h:f, h:f, ... up to 12 points, the propeller force x f at
;                 airscrew height h m, linear between points, flat outside. Built from the REAL engine's supercharger bands
;                 over the host's own power curve (tools/jhfm_bench4.py, FIT4.md): k * P_real(h) / P_host(h).
; [<host>:<wing class>] k_add: CD + k_add*CL^2 on the wing panels (span efficiency: sets the sustained turn).
; d, t, k_add hunted per plane on real weight (top speed at the historical height, SL climb, SL turn; +-25 % priors
;   on drag and power; FIT3.md). Dive acceleration and dive limit are held-out checks. pred. = bench, NOT flown.

[jhfm]
enabled=1
log=1
; 1 = install every hook, run the registry, change NOTHING - only log what would change (a safe first flight)
dry_run=0
log_every_s=60
aero=1
prop=1
; 1 = [JOINT@] sections (dump only by default: logging, no change)
struct=1
; jhfm 1.2.0: seconds a FUEL-TANK fire takes from ignition to full (stock 10). Global: every plane, stock ones too. Paces the
; staged fire effects of Pingu's Impact FX 1.1 (white smoke > black smoke > small fire > big fire). 10 or 0 = stock.
; Engine fires (~30-40 s) and fires put out in water are not changed. Range 0..120.
tank_fire_s=10
; jhfm 1.4.0: 1 = mass_scale / inertia_scale (real weights); 0 = every plane keeps its host mass
mass=1

