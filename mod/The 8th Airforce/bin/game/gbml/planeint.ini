; planeint.ini - GB Mod Loader plugin "planeint" (renamed from scriptcrc 2026-11-10: this is the
; plane/loose-script integrity plugin only now - mission maps are their own plugin, loosemaps).
; Behavior is byte-for-byte the real scriptcrc 1.5.0 (plane-script CRC skip, mode= rules, the
; new_planes ownership check); only its name changed, so its own ini section is [planeint] too.
; See scriptcrc_1_8_0.c-derived planeint.c for what each key does, or docs/SCRIPTCRC_MODES.md.

[planeint]
enabled=1
log=1
offline_only=0
; JH re-host fix 1 (18 Nov): mode=uniform. "slots" refuses every JH plane script (they change stock lines,
; not only add weapon-mode slots) -> #10003 on every JH swap. uniform = single player, owned planes, as scriptcrc did.
mode=uniform
multiplayer=1
new_planes=1
log_poll_ms=250
