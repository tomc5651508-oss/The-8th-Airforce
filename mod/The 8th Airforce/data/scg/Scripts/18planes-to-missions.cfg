//Значение для modifications_required берётся из WeaponMods в редакторе миссий. Важно соблюдать последовательность разрядов, в которых стоит 1. Например, для WeaponMods=11 в редакторе миссий, верным будет как значение modifications_required=0b11, так и modifications_required=0b000011. Но ни в коем случае нельзя ставить 0 после 11 в данном примере, это будет совсем другой weapon mode. Отсчёт 1 ведётся справа налево.
//Значение для modifications_denied так же берётся из WeaponMods в редакторе миссий, за исключением одного важного пункта. Первая правая цифра всегда должна быть 0, потому что первая правая цифра - это дефолтный WeaponMods=1. Если поставить первой правой цифрой 1, то у самолёта не будет боекомплекта, так как заблокируется дефолтный weapon mode.
//Чтобы запретить несколько модификаций из одной группы, например подвесы и бомбы для 109G2, нужно определить разряд, в котором стоит 1, при выборе необходимой модификации. Weapon mode = 11 для подвесов, то есть первая правая цифра 1 - это дефолтный weapon mode, куда входят 2xMG17 и 1xMG151 в развале цилиндров двигателя, вторая правая цифра 1 - это подвесные 2xMG151. Weapon mode = 101 для SC50x4, Weapon mode = 1001 для SC250x1. Значит, верное значение для блокировки подвесов и всех бомб на 109G2 будет modifications_denied=0b1110.